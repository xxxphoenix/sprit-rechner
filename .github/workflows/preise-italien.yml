name: Preise Italien aktualisieren

on:
  schedule:
    - cron: "40 7 * * *"   # täglich nach der Veröffentlichung der 8-Uhr-Preise
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_it.py
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/it
          git diff --cached --quiet || (git commit -m "Preise Italien $(date -u +%F)" && git push)
