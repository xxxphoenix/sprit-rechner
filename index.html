<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprit-Rechner</title>
<meta name="theme-color" content="#0e5c68">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sprit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<div id="app"><p style="padding:24px 16px">Sprit-Rechner wird geladen …</p></div>
<script>
window.onerror = function (msg) {
  var el = document.getElementById('app');
  if (el && !el.querySelector('.main')) el.innerHTML = '<p style="padding:24px 16px">Die App konnte auf diesem Gerät nicht starten. Bitte den Browser aktualisieren.<br><small>' + String(msg).replace(/</g, '&lt;') + '</small></p>';
};
</script>
<script src="vendor/qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
